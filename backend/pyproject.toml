[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Podman Compose stack"
authors = ["crash"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.133.1"
uvicorn = "^0.41.0"
psycopg2-binary = "^2.9"
bcrypt = "^4.0"
itsdangerous = "^2.1"
jinja2 = "^3.1"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
