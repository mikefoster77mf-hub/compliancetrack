{% extends "base.html" %}

{% block title %}Sign up — ComplianceTrack{% endblock %}

{% block content %}
<section class="card" style="max-width:420px; margin:0 auto;">
  <h2 style="margin-bottom:var(--space-lg);">Create your account</h2>
  <form id="signup-form" style="display:flex; flex-direction:column; gap:var(--space-md);">
    <label>
      Name
      <input type="text" name="name" 
        style="width:100%; padding:var(--space-sm) var(--space-md); border:1px solid var(--border-subtle); border-radius:var(--radius-md); background:var(--surface-elevated); color:var(--text-primary); font-size:inherit;"
        placeholder="Your name (optional)">
    </label>
    <label>
      Email
      <input type="email" name="email" required
        style="width:100%; padding:var(--space-sm) var(--space-md); border:1px solid var(--border-subtle); border-radius:var(--radius-md); background:var(--surface-elevated); color:var(--text-primary); font-size:inherit;"
        placeholder="you@example.com">
    </label>
    <label>
      Password
      <input type="password" name="password" required minlength="8"
        style="width:100%; padding:var(--space-sm) var(--space-md); border:1px solid var(--border-subtle); border-radius:var(--radius-md); background:var(--surface-elevated); color:var(--text-primary); font-size:inherit;"
        placeholder="At least 8 characters">
    </label>
    <button type="submit" class="btn primary" style="width:100%; justify-content:center;">
      Create account
    </button>
    <p style="text-align:center; font-size:var(--text-label); margin-top:var(--space-sm);">
      Already have an account? <a href="/login" style="color:var(--accent-primary);">Log in</a>
    </p>
  </form>
  <p id="signup-status" style="margin-top:var(--space-md); text-align:center; font-size:var(--text-label); min-height:1.4em;"></p>
</section>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('signup-form');
  const status = document.getElementById('signup-status');
  if (!form || !status) return;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.textContent;

    btn.disabled = true;
    btn.textContent = 'Creating account…';
    status.textContent = '';
    status.style.color = 'var(--text-hinting)';

    const formData = new FormData(form);
    const data = {
      name: formData.get('name') || '',
      email: formData.get('email') || '',
      password: formData.get('password') || '',
    };

    try {
      const resp = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });

      const result = await resp.json();

      if (resp.ok) {
        status.textContent = 'Account created! Logging you in…';
        status.style.color = 'var(--success)';
        btn.textContent = 'Logging in…';

        const loginResp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'same-origin',
        });

        if (loginResp.ok) {
          window.location.href = '/dashboard';
        } else {
          window.location.href = '/login';
        }
      } else if (resp.status === 409) {
        btn.textContent = originalText;
        btn.disabled = false;
        status.textContent = 'An account with this email already exists.';
        status.style.color = 'var(--error)';
      } else {
        btn.textContent = originalText;
        btn.disabled = false;
        status.textContent = result.detail || 'Signup failed — please try again.';
        status.style.color = 'var(--error)';
      }
    } catch (err) {
      btn.textContent = originalText;
      btn.disabled = false;
      status.textContent = 'Network error — please try again.';
      status.style.color = 'var(--error)';
    }
  });
});
</script>
{% endblock %}
