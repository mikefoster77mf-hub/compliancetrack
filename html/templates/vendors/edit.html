{% extends "base.html" %}

{% block title %}Edit {{ vendor.name }} — ComplianceTrack{% endblock %}

{% block content %}
<div style="max-width:500px; margin:0 auto;">
  <h2 style="margin-bottom:var(--space-lg);">Edit vendor</h2>

  <form id="vendor-edit-form" style="display:flex; flex-direction:column; gap:var(--space-md);">
    <label>
      Name <span style="color:var(--error);">*</span>
      <input type="text" name="name" required value="{{ vendor.name }}"
        style="width:100%; padding:var(--space-sm) var(--space-md); border:1px solid var(--border-subtle); border-radius:var(--radius-md); background:var(--surface-elevated); color:var(--text-primary); font-size:inherit;">
    </label>
    <label>
      Email
      <input type="email" name="email" value="{{ vendor.email }}"
        style="width:100%; padding:var(--space-sm) var(--space-md); border:1px solid var(--border-subtle); border-radius:var(--radius-md); background:var(--surface-elevated); color:var(--text-primary); font-size:inherit;">
    </label>
    <label>
      Phone
      <input type="text" name="phone" value="{{ vendor.phone }}"
        style="width:100%; padding:var(--space-sm) var(--space-md); border:1px solid var(--border-subtle); border-radius:var(--radius-md); background:var(--surface-elevated); color:var(--text-primary); font-size:inherit;">
    </label>
    <label>
      Address
      <textarea name="address" rows="2">{{ vendor.address }}</textarea>
    </label>
    <label>
      Notes
      <textarea name="notes" rows="3">{{ vendor.notes }}</textarea>
    </label>

    <div style="display:flex; gap:var(--space-md);">
      <button type="submit" class="btn primary" style="flex:1; justify-content:center;">
        Save changes
      </button>
      <a href="/vendors/{{ vendor.id }}" style="flex:0 0 auto; color:var(--text-secondary); text-decoration:underline;">Cancel</a>
    </div>

    <p id="vendor-status" style="margin-top:var(--space-md); text-align:center; font-size:var(--text-label); min-height:1.4em;"></p>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('vendor-edit-form');
  const status = document.getElementById('vendor-status');
  if (!form || !status) return;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.textContent;

    btn.disabled = true;
    btn.textContent = 'Saving…';
    status.textContent = '';
    status.style.color = 'var(--text-hinting)';

    const formData = new FormData(form);
    const data = {
      name: formData.get('name') || '',
      email: formData.get('email') || '',
      phone: formData.get('phone') || '',
      address: formData.get('address') || '',
      notes: formData.get('notes') || '',
    };

    try {
      const resp = await fetch('/api/vendors/' + {{ vendor.id }}, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        credentials: 'same-origin',
      });

      const result = await resp.json();

      if (resp.ok) {
        window.location.href = '/vendors/' + {{ vendor.id }};
      } else {
        btn.textContent = originalText;
        btn.disabled = false;
        status.textContent = result.detail || 'Failed to save changes — please try again.';
        status.style.color = 'var(--error)';
      }
    } catch (err) {
      btn.textContent = originalText;
      btn.disabled = false;
      status.textContent = 'Network error — please try again.';
      status.style.color = 'var(--error)';
    }
  });
});
</script>
{% endblock %}
